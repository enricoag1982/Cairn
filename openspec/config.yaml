schema: spec-driven
githubCopilot:
  cloudAgent: false

# Project context, shown to AI agents when they create change artifacts.
# Keep it short: it points to the real sources of truth instead of copying them.
context: |
  Read AGENTS.md at the repository root first; it is the canonical guide for this project.
  Decisions: docs/decisions/ (MADR ADRs, decision log in docs/decisions/README.md).
    Accepted ADRs are binding; proposed ADRs are open questions and must not be assumed decided.
  Vocabulary: docs/glossary.md. Use its terms verbatim in specs.
  Architecture (current state): docs/architecture/README.md.
  Implementation language: Java 25 (ADR-0005), built with Gradle (ADR-0015), both accepted.
  Core design (accepted): ADR-0007 to ADR-0013, ADR-0017 (AI agents as first-class users), ADR-0018 (rules in Java),
    ADR-0019 (entity IDs), ADR-0020 (patterns as I-Regexp), ADR-0021 (generated Java types), ADR-0022 (durable stores), ADR-0023 (queries as data), ADR-0024 (purge), ADR-0025 (rules run again when what they read changes), ADR-0026 (unique keys resolved at commit), ADR-0027 (bitemporal data as keys over an ordered key-value interface), ADR-0028 (stores kept in RocksDB), ADR-0029 (the change feed), ADR-0030 (checks in CEL), ADR-0031 (derived attributes), ADR-0032 (rules that read the state before the transaction) and ADR-0033 (purges by unique key).
    Types are defined in YAML 1.2 schema documents (ADR-0012).
    Build and test with ./gradlew build; shared build configuration only in build-logic/, versions in gradle/libs.versions.toml.
  Spec scenarios use the reference domain in docs/reference/reference-domain.md (cite stories by ID, RD-n);
    its names never appear in normative requirement text.
  Process: docs/process/development-workflow.md.

# Per-artifact rules, applied on top of the schema's own instructions.
rules:
  proposal:
    - Reference related ADRs by ID (for example ADR-0002) and say whether the change depends on a proposed (undecided) ADR.
    - Include a "Non-goals" bullet list under What Changes when scope could be misread.
  specs:
    - Use terms from docs/glossary.md; if a new domain term is needed, the tasks must include adding it to the glossary.
    - Specify observable behavior only; implementation choices belong in design.md or an ADR.
  design:
    - Keep local, easily reversible decisions here. For any decision that is costly to reverse or affects other capabilities, create an ADR with `npm run adr:new -- "<title>"` and link it instead of repeating its reasoning.
  tasks:
    - End with a "Documentation" task group covering affected docs (architecture, guides, reference, glossary), ADR status updates and `npm run check`.

# Per-operation guidance, applied when implementing and archiving.
operations:
  apply:
    guidance:
      - Keep specs and code in sync; if implementation shows a requirement is wrong, update the delta spec first and tell the user.
  archive:
    guidance:
      - Before archiving, move ADRs linked from this change out of `proposed` status (accepted or rejected) and run `npm run check`.
